<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2pf9XZb9Ck5PcU1KQDk_Wc6ujJQVPdvIqIq75etqQchIrrY0avbDjv8cZ1OqRo5Y6cks0qexAVrUx/gviz/tq?tqx=out:json";

fetch(sheetURL)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;
    const container = document.getElementById("jobs-list");
    container.innerHTML = "";

    if (!rows.length) {
      container.innerHTML = `<p class='no-jobs'>No jobs posted yet.</p>`;
      return;
    }

    // Get header names dynamically
    const headerCells = rows[0].c.map(c => c ? c.v.toString().trim() : "");

    // Find column indexes by header name
    const idxTitle = headerCells.indexOf("Job Title");
    const idxCompany = headerCells.indexOf("Company Name");
    const idxLocation = headerCells.indexOf("Location");
    const idxCategory = headerCells.indexOf("Job Category");
    const idxDeadline = headerCells.indexOf("Deadline");

    rows.slice(1).forEach(row => {
      let cells = row.c.map(c => c ? c.v : "");

      const jobTitle = cells[idxTitle];
      const company = cells[idxCompany];
      const location = cells[idxLocation];
      const category = cells[idxCategory];
      const deadline = cells[idxDeadline];

      if (!jobTitle) return;

      const jobHTML = `
        <div class='job-card'>
          <div class='job-title'>${jobTitle}</div>
          <div class='job-meta'><strong>Company:</strong> ${company}</div>
          <div class='job-meta'><strong>Location:</strong> ${location}</div>
          <div class='job-meta'><strong>Category:</strong> ${category}</div>
          <div class='job-meta'><strong>Deadline:</strong> ${deadline}</div>
        </div>
      `;

      container.innerHTML += jobHTML;
    });
  })
  .catch(err => {
    document.getElementById("jobs-list").innerHTML = "Error loading jobs.";
    console.error(err);
  });
</script>
